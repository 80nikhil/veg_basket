{% extends "adminpanel/base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="fw-bold">Send Firebase Notification</h4>
</div>

{% if messages %}
  {% for message in messages %}
    <div class="alert alert-info">{{ message }}</div>
  {% endfor %}
{% endif %}

<div class="card p-3">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" name="title" class="form-control" placeholder="Enter notification title" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Body</label>
      <textarea name="body" class="form-control" rows="4" placeholder="Enter notification body" required></textarea>
    </div>

    <button type="submit" class="btn btn-success">Send Notification</button>
  </form>
</div>

{% endblock %}
